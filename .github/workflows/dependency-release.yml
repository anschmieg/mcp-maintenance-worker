name: Test and release dependency updates
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-release
jobs:
  test-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.3'
      - run: bash scripts/update-dependencies.sh
      - id: diff
        run: |
          git diff --binary -- go.mod go.sum worker/package.json worker/package-lock.json experiments/tailnet/package.json experiments/tailnet/package-lock.json experiments/tailnet/upstream.sha > "$RUNNER_TEMP/dependencies.patch"
          if test -s "$RUNNER_TEMP/dependencies.patch"; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - if: steps.diff.outputs.changed == 'true'
        run: |
          VERIFY_TAILNET_BUILD=1 bash scripts/verify.sh
          git diff --binary -- go.mod go.sum worker/package.json worker/package-lock.json experiments/tailnet/package.json experiments/tailnet/package-lock.json experiments/tailnet/upstream.sha | cmp - "$RUNNER_TEMP/dependencies.patch"
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-dependency-patch
          path: ${{ runner.temp }}/dependencies.patch
  publish:
    needs: test-update
    if: needs.test-update.outputs.changed == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-dependency-patch
          path: ${{ runner.temp }}
      - name: Commit tested manifests and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git apply --index --include=go.mod --include=go.sum --include=worker/package.json --include=worker/package-lock.json --include=experiments/tailnet/package.json --include=experiments/tailnet/package-lock.json --include=experiments/tailnet/upstream.sha "$RUNNER_TEMP/dependencies.patch"
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update tested dependencies' -m 'Co-authored-by: OpenBot <335604065+openbotgit[bot]@users.noreply.github.com>'
          tag="dependencies-$(git rev-parse --short=12 HEAD)"
          git tag "$tag"
          git push --atomic origin "HEAD:refs/heads/$BASE_BRANCH" "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag" --notes 'Automated dependency update. Go and local Worker MCP tests passed. Cloudflare deployment is separate.'
