<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance approval</title>
<main>
  <h1 id="title">Maintenance approval</h1>
  <p id="details"></p>
  <label id="setup" hidden>Setup code <input id="token" type="password" autocomplete="off"></label>
  <p><button id="resume" hidden>Continue host setup</button></p>
  <textarea id="install-command" rows="8" cols="48" readonly hidden aria-label="Host installation command"></textarea>
  <div id="host-settings" hidden>
    <p><label>Tailscale IPv4 address <input id="address" autocomplete="off"></label></p>
    <p><label>SSH host key fingerprint <input id="fingerprint" autocomplete="off"></label></p>
  </div>
  <p><button id="action" disabled>Continue</button></p>
  <p id="status" role="status"></p>
</main>
<script src="/passkeys/browser.js" defer></script>
